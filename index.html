<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- Route-varying defaults below carry data-default-meta: once the app
         mounts, SEO.jsx removes them and react-helmet owns these tags (no
         duplicates in the DOM). Without JS, crawlers read these defaults —
         and the build bakes per-route values into static route HTML. -->
    <meta
      data-default-meta
      name="description"
      content="Flourishing Souls Foundation supports orphaned and vulnerable children through education, healthcare, and community upliftment — with full transparency into every donation."
    />
    <meta
      name="keywords"
      content="Charity, Donation, Volunteer, Events, Nonprofit, Orphan Care, Education, Healthcare, Support, Community, Flourishing Souls"
    />
    <meta name="author" content="Flourishing Souls Foundation" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Browser icon: layered favicon + PWA icons -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#8DA86D" />

    <title>Flourishing Souls Foundation — Empowering Lives, Nurturing Hope</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn, Telegram, …) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Flourishing Souls Foundation" />
    <meta
      data-default-meta
      property="og:title"
      content="Flourishing Souls Foundation — Empowering Lives, Nurturing Hope"
    />
    <meta
      data-default-meta
      property="og:description"
      content="We support orphaned and vulnerable children through education, healthcare, and community upliftment — with full transparency into every donation."
    />
    <meta data-default-meta property="og:url" content="https://flourishingsoulsfoundation.org/" />
    <meta
      data-default-meta
      property="og:image"
      content="https://flourishingsoulsfoundation.org/images/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      data-default-meta
      property="og:image:alt"
      content="Flourishing Souls Foundation logo — a circle of joined hands in purple and gold"
    />
    <meta property="og:locale" content="en_NG" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      data-default-meta
      name="twitter:title"
      content="Flourishing Souls Foundation — Empowering Lives, Nurturing Hope"
    />
    <meta
      data-default-meta
      name="twitter:description"
      content="We support orphaned and vulnerable children through education, healthcare, and community upliftment — with full transparency into every donation."
    />
    <meta
      data-default-meta
      name="twitter:image"
      content="https://flourishingsoulsfoundation.org/images/og-image.png"
    />
    <meta
      name="twitter:image:alt"
      content="Flourishing Souls Foundation logo — a circle of joined hands in purple and gold"
    />

    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://mvvxmknjxadvjkkedtpo.supabase.co wss://mvvxmknjxadvjkkedtpo.supabase.co https://js.paystack.co; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://js.paystack.co;" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=()" />
    <link data-default-meta rel="canonical" href="https://flourishingsoulsfoundation.org/" />
  </head>
  <body class="min-h-screen bg-white text-neutral-900 antialiased">
    <div id="portal-root"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
